<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="OT-FORTRESS Logo">
  <defs>
    <!-- Gradiente Escudo Exterior -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="40%" stop-color="#168dce"/>
      <stop offset="100%" stop-color="#08304f"/>
    </linearGradient>
    
    <!-- Gradiente Resplandor Neón -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente Metalizado Oscuro -->
    <linearGradient id="darkPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c3755"/>
      <stop offset="100%" stop-color="#041826"/>
    </linearGradient>

    <!-- Sombra Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura Resplandeciente -->
  <circle cx="64" cy="64" r="56" fill="url(#glow)"/>

  <!-- Capa Exterior Escudo Ciber-Industrial -->
  <path d="M64 8 L108 24 V58 C108 86 89.2 110 64 120 C38.8 110 20 86 20 58 V24 L64 8 Z" 
        fill="url(#darkPlate)" 
        stroke="url(#shieldGrad)" 
        stroke-width="5"
        stroke-linejoin="round"/>

  <!-- Bisel Interior Escudo -->
  <path d="M64 18 L98 31 V58 C98 80 83 99 64 108 C45 99 30 80 30 58 V31 L64 18 Z" 
        fill="none" 
        stroke="#73ccef" 
        stroke-width="2" 
        opacity="0.55"/>

  <!-- Enrejado de Circuito OT / Red Industrial -->
  <g stroke="#00e5ff" stroke-width="1.8" opacity="0.8" stroke-linecap="round">
    <line x1="64" y1="28" x2="64" y2="44"/>
    <line x1="64" y1="84" x2="64" y2="98"/>
    <line x1="38" y1="58" x2="50" y2="58"/>
    <line x1="78" y1="58" x2="90" y2="58"/>
    <!-- Nodos diagonales -->
    <line x1="46" y1="42" x2="54" y2="50"/>
    <line x1="82" y1="42" x2="74" y2="50"/>
    <line x1="46" y1="74" x2="54" y2="66"/>
    <line x1="82" y1="74" x2="74" y2="66"/>
  </g>

  <!-- Nodos de Red Industrial -->
  <circle cx="64" cy="28" r="3.5" fill="#00e5ff" filter="url(#neonGlow)"/>
  <circle cx="38" cy="58" r="3.5" fill="#00e5ff" filter="url(#neonGlow)"/>
  <circle cx="90" cy="58" r="3.5" fill="#00e5ff" filter="url(#neonGlow)"/>
  <circle cx="64" cy="98" r="3.5" fill="#00e5ff" filter="url(#neonGlow)"/>

  <!-- Fortaleza Céntrica / Núcleo de Seguridad Protegido -->
  <path d="M64 44 L78 52 V72 L64 80 L50 72 V52 Z" 
        fill="url(#shieldGrad)" 
        stroke="#ffffff" 
        stroke-width="2.5"
        filter="url(#neonGlow)"/>

  <!-- Rayo / Símbolo Central Neón -->
  <path d="M66 49 L57 63 H65 L62 75 L73 60 H65 L68 49 Z" 
        fill="#ffffff" 
        stroke="#ffffff" 
        stroke-width="0.8" 
        stroke-linejoin="round"/>
</svg>
